<style>
/* Düzen: tek sütun, üstte canlı fiyat durumu, altında 3 sekme (Sonuç / Altınlarım / Kuyumcular). Telefon önce. */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --sunk:#E7E9E3; --fg:#1B201D; --muted:#5D6560; --line:#D5D8D1;
  --gold:#8A6212; --gold-soft:#F2E7CB; --good:#1F6B45; --good-soft:#DAEEE1; --bad:#A33434; --bad-soft:#F6DFDC;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111412; --surface:#1A1E1B; --sunk:#232825; --fg:#E8EBE6; --muted:#9AA39D; --line:#2E3430;
    --gold:#D8B35C; --gold-soft:#3A301D; --good:#6CC894; --good-soft:#1C3327; --bad:#EE8B82; --bad-soft:#3B2220;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#1A1E1B; --sunk:#232825; --fg:#E8EBE6; --muted:#9AA39D; --line:#2E3430;
  --gold:#D8B35C; --gold-soft:#3A301D; --good:#6CC894; --good-soft:#1C3327; --bad:#EE8B82; --bad-soft:#3B2220;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:14px 60px;
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.app{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.hint{font-size:14px;color:var(--muted);margin:0}
button{font:inherit;cursor:pointer;color:var(--fg)}
input{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Üst kısım */
.top{display:flex;flex-direction:column;gap:6px}
.live{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.live[data-s="live"] .dot{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.live[data-s="off"] .dot{background:var(--bad)}
.live b{color:var(--fg);font-weight:600}
.linkbtn{border:0;background:none;padding:2px 4px;color:var(--gold);font-size:14px;font-weight:600;text-decoration:underline}
.note{font-size:13px;color:var(--muted)}
.note.warn{color:var(--bad)}

/* Sekmeler */
.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:6px;margin-inline:-4px;padding-inline:4px}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:9px 4px;font-size:15px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tabs .cnt{font-weight:500;color:var(--muted);font-size:13px}

.view{display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.empty{text-align:center;padding:26px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted)}

/* Sonuç: Harem kutusu */
.harem{display:flex;flex-direction:column;gap:2px;background:var(--gold-soft);border-color:transparent}
.harem .lbl{font-size:13px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.harem .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:28px;font-weight:600;color:var(--fg);line-height:1.2}
.harem .sub{font-size:13px;color:var(--muted)}

/* Sonuç: sıralama */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rcard.top{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.r-head{display:flex;align-items:center;gap:10px}
.r-no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--sunk);flex:none}
.rcard.top .r-no{background:var(--good);color:var(--bg)}
.r-name{font-weight:700;font-size:17px;flex:1;min-width:0;overflow-wrap:anywhere}
.badge{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--good-soft);color:var(--good);flex:none}
.r-total{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.15}
.rcard.top .r-total{color:var(--good)}
.facts{display:flex;flex-direction:column;gap:4px;margin:0;font-size:14px}
.facts div{display:flex;justify-content:space-between;gap:12px;padding-top:4px;border-top:1px dashed var(--line)}
.facts dt{color:var(--muted)}
.facts dd{margin:0;text-align:right;font-weight:600}
.facts dd .num{font-weight:600}
.alert{font-size:13px;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:7px 10px}
.rcard.partial{opacity:.9}
.rcard.partial .r-no{background:var(--bad-soft);color:var(--bad)}

/* Sonuç: fiyat tablosu */
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
thead th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;background:var(--sunk)}
th[scope="row"],thead th:first-child,tfoot th{text-align:left}
th[scope="row"]{font-weight:600}
th small,td small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
td small{font-family:var(--mono)}
td.h,th.h{background:color-mix(in srgb, var(--gold-soft) 55%, var(--surface))}
thead th.h{color:var(--gold)}
td.best{color:var(--good);font-weight:600;background:color-mix(in srgb, var(--good-soft) 55%, var(--surface))}
tfoot td,tfoot th{font-weight:700;border-bottom:0}
tfoot tr:first-child td,tfoot tr:first-child th{border-top:2px solid var(--fg)}
th[scope="row"],thead th:first-child,tfoot th{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line)}
thead th:first-child{background:var(--sunk)}

/* Kuyumcular arası farklar */
.pairs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pairs li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.pairs li:last-child{border-bottom:0}
.pairs .who{min-width:0;overflow-wrap:anywhere}
.pairs .who small{display:block;color:var(--muted);font-size:13px}
.pairs .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}

/* Altınlarım */
.alist{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:0}
.a-name{font-weight:700}
.a-name small{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.a-val{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.a-val b{color:var(--fg)}
.a-in{grid-column:1 / -1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fld{display:flex;align-items:center;gap:8px;min-width:0}
.fld > span{font-size:14px;color:var(--muted);width:34px;flex:none}
.fld > span.e{color:var(--gold)}
.in{width:100%;min-width:0;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:right;height:44px}
.in.has{border-color:var(--gold);background:var(--gold-soft)}
.a-total{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-weight:600}
.a-total b{font-family:var(--mono);font-size:19px;color:var(--gold)}

/* Kuyumcular */
.olist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.olist li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.olist li:last-child{border-bottom:0}
.olist .o-n{font-weight:700;overflow-wrap:anywhere}
.olist small{display:block;color:var(--muted);font-size:14px;font-family:var(--mono)}
.olist small.neg{color:var(--bad);font-family:var(--body)}
form.of{display:flex;flex-direction:column;gap:14px}
.flabel{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}
.flabel .in{text-align:left;font-family:var(--body)}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.frow label{font-weight:600}
.frow label small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.fcalc{grid-column:1 / -1;font-size:13px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);min-height:18px}
.fsum{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:10px;padding:10px 12px}
.fsum b{font-family:var(--mono);font-size:22px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.ferr{color:var(--bad);font-size:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <h1>Altın Bozdurma</h1>
    <div class="live" id="live" data-s="wait"><span class="dot"></span><span id="liveText">Harem'e bağlanıyor…</span><button type="button" class="linkbtn" id="refreshBtn">Yenile</button></div>
    <div class="note" id="liveNote"></div>
  </header>

  <nav class="tabs" aria-label="Bölümler">
    <div class="tabs-in" role="tablist">
      <button type="button" role="tab" id="tab-sonuc" data-tab="sonuc" aria-selected="true">Sonuç</button>
      <button type="button" role="tab" id="tab-altin" data-tab="altin" aria-selected="false">Altınlarım</button>
      <button type="button" role="tab" id="tab-kuyumcu" data-tab="kuyumcu" aria-selected="false">Kuyumcular <span class="cnt" id="kCount"></span></button>
    </div>
  </nav>

  <main>
    <section class="view" id="v-sonuc" role="tabpanel"></section>
    <section class="view" id="v-altin" role="tabpanel" hidden></section>
    <section class="view" id="v-kuyumcu" role="tabpanel" hidden></section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.0/socket.io.min.js"></script>
<script>
(function(){
"use strict";
const LS_STATE = "altin-bozdurma-v2";
const LS_PRICES = "altin-bozdurma-fiyat-v1";
const LS_UI = "altin-bozdurma-ui-v1";

const ROWS = [
  {key:"CEYREK", name:"Çeyrek", coin:true},
  {key:"YARIM", name:"Yarım", coin:true},
  {key:"TEK", name:"Tam", coin:true},
  {key:"ATA", name:"Ata", coin:true},
  {key:"ATA5", name:"Ata 5'li", coin:true},
  {key:"GREMESE", name:"Gremse", coin:true},
  {key:"AYAR22", name:"22 Ayar Bilezik", coin:false},
  {key:"AYAR14", name:"14 Ayar", coin:false},
  {key:"KULCEALTIN", name:"Gram Altın (24 ayar)", coin:false}
];
const codesOf = r => r.coin ? [r.key+"_YENI", r.key+"_ESKI"] : [r.key];
const ALL_CODES = ROWS.flatMap(codesOf);
const rowOf = c => ROWS.find(r => codesOf(r).includes(c));
const isGram = c => !(c.endsWith("_YENI") || c.endsWith("_ESKI"));
const tagOf = c => c.endsWith("_YENI") ? "Yeni" : c.endsWith("_ESKI") ? "Eski" : "";
const label = c => { const r = rowOf(c); return tagOf(c) ? `${r.name} · ${tagOf(c)}` : r.name; };
const unitW = c => isGram(c) ? "gr" : "adet";

const DEFAULT_STATE = {
  holdings: { TEK_ESKI: 9, ATA_ESKI: 2, YARIM_ESKI: 3, AYAR22: 129 },
  offers: [
    { id:"o1", name:"1. Kuyumcu", stated:1236050,
      units:{ TEK_ESKI:359250/9, ATA_ESKI:82300/2, YARIM_ESKI:60000/3, AYAR22:734500/129 } },
    { id:"o2", name:"Damla Kuyum", stated:1238875,
      units:{ TEK_ESKI:39950, ATA_ESKI:41200, YARIM_ESKI:19950, AYAR22:5675 } }
  ]
};
const FALLBACK_TIME = "31-10-2026 14:57:05";
const FALLBACK_ALIS = { CEYREK_YENI:10147, CEYREK_ESKI:9973, YARIM_YENI:20320, YARIM_ESKI:19946, TEK_YENI:40515, TEK_ESKI:39954,
  ATA_YENI:41605, ATA_ESKI:41182, ATA5_YENI:207560, ATA5_ESKI:205690, GREMESE_YENI:100539, GREMESE_ESKI:99417,
  AYAR22:5670.06, AYAR14:3400.50, KULCEALTIN:6201.86, ALTIN:6233.03 };

function load(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

let state = load(LS_STATE) || JSON.parse(JSON.stringify(DEFAULT_STATE));
state.holdings = state.holdings || {};
state.offers = (state.offers || []).map(o => ({ id:o.id, name:o.name || "", stated:o.stated || null, units:o.units || {} }));
const persist = () => save(LS_STATE, state);

const cached = load(LS_PRICES);
let prices = cached && cached.prices ? cached.prices
  : Object.fromEntries(Object.entries(FALLBACK_ALIS).map(([k, v]) => [k, { alis: v }]));
let priceTime = cached && cached.time ? cached.time : FALLBACK_TIME;

const ui = Object.assign({ tab:"sonuc", tview:"unit" }, load(LS_UI) || {});
const saveUi = () => save(LS_UI, { tab: ui.tab, tview: ui.tview });

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function fmt(n, dec){
  if (n == null || !isFinite(n)) return "—";
  const d = dec != null ? dec : (Math.abs(n - Math.round(n)) < 0.005 ? 0 : 2);
  return n.toLocaleString("tr-TR", { minimumFractionDigits:d, maximumFractionDigits:d });
}
const tl = (n, d) => (n == null || !isFinite(n)) ? "—" : fmt(n, d) + " ₺";
const tl0 = n => tl(n, Math.abs(n - Math.round(n)) < 0.005 ? 0 : 2);
function signed(n){
  if (!isFinite(n)) return "—";
  if (Math.abs(n) < 0.5) return "±0 ₺";
  return (n > 0 ? "+" : "−") + fmt(Math.abs(n), 0) + " ₺";
}
function parseNum(s){
  if (s == null) return NaN;
  s = String(s).replace(/[\s₺]/g, "").replace(/tl$/i, "");
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if ((s.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g, "");
  return parseFloat(s);
}
const nameOf = o => (o.name || "").trim() || "İsimsiz kuyumcu";
const nm = o => esc(nameOf(o));

const qty = c => state.holdings[c] || 0;
const owned = () => ALL_CODES.filter(c => qty(c) > 0);
function hUnit(c){ const p = prices[c]; if (!p) return null; const v = parseFloat(p.alis); return isFinite(v) ? v : null; }
const oUnit = (o, c) => (o.units[c] != null && isFinite(o.units[c]) && o.units[c] > 0) ? o.units[c] : null;

function haremTotal(){
  let t = 0, missing = false;
  for (const c of owned()){ const u = hUnit(c); if (u == null){ missing = true; continue; } t += u * qty(c); }
  return { t, missing };
}
function offerTotal(o){
  let t = 0; const missing = [];
  for (const c of owned()){ const u = oUnit(o, c); if (u == null){ missing.push(c); continue; } t += u * qty(c); }
  return { t, missing };
}
function pct(d, base){ return base > 0 ? "%" + fmt(Math.abs(d) / base * 100, 2) : ""; }
function vsHarem(d, base){
  if (!isFinite(d)) return "—";
  if (Math.abs(d) < 0.5) return `<span class="num">aynı</span>`;
  return `<span class="${d < 0 ? "neg" : "pos"}"><span class="num">${fmt(Math.abs(d), 0)} ₺</span> ${d < 0 ? "düşük" : "yüksek"} <span class="muted">(${pct(d, base)})</span></span>`;
}

/* ================= SEKMELER ================= */
function setTab(t){
  ui.tab = t; saveUi();
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false");
  $("v-sonuc").hidden = t !== "sonuc";
  $("v-altin").hidden = t !== "altin";
  $("v-kuyumcu").hidden = t !== "kuyumcu";
  if (t === "sonuc") renderSonuc();
  if (t === "altin") renderAltin();
  if (t === "kuyumcu") renderKuyumcu();
  window.scrollTo(0, 0);
}
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab);
});
function updateCount(){ $("kCount").textContent = state.offers.length ? `(${state.offers.length})` : ""; }

/* ================= SONUÇ ================= */
function renderSonuc(){
  const v = $("v-sonuc");
  const own = owned();
  if (!own.length){
    v.innerHTML = `<div class="box empty"><p>Önce bozduracağın altınları gir.</p><button type="button" class="btn primary" data-go="altin">Altınlarımı gir</button></div>`;
    return;
  }
  const h = haremTotal();
  const res = state.offers.map(o => ({ o, ...offerTotal(o) }));
  const full = res.filter(r => !r.missing.length).sort((a, b) => b.t - a.t);
  const partial = res.filter(r => r.missing.length);
  const best = full[0];
  const ptime = priceTime ? priceTime.slice(0, 16).replace(/-/g, ".") : "";

  let html = `<div class="box harem">
      <span class="lbl">Harem anlık alış fiyatıyla</span>
      <span class="val">${h.missing ? "—" : tl0(h.t)}</span>
      <span class="sub">Elindeki altınların değeri · fiyat saati ${ptime}</span>
    </div>`;

  if (!state.offers.length){
    html += `<div class="box empty"><p>Henüz kuyumcu fiyatı girmedin. Kuyumcukent'te fiyat aldıkça buraya ekle, sıralamayı burada görürsün.</p><button type="button" class="btn primary" data-go="new">+ Kuyumcu fiyatı ekle</button></div>`;
    v.innerHTML = html; return;
  }

  // Sıralama
  html += `<h2>Sıralama</h2><ol class="rank">`;
  full.forEach((r, i) => {
    const d = r.t - h.t;
    let facts = `<div><dt>Harem'e göre</dt><dd>${h.missing ? "—" : vsHarem(d, h.t)}</dd></div>`;
    if (i === 0 && full[1]) facts += `<div><dt>2. sıradakinden fazla</dt><dd class="pos"><span class="num">${fmt(r.t - full[1].t, 0)} ₺</span></dd></div>`;
    if (i > 0) facts += `<div><dt>1. sıradakinden (${nm(best.o)}) eksik</dt><dd class="neg"><span class="num">${fmt(best.t - r.t, 0)} ₺</span></dd></div>`;
    let alert = "";
    if (r.o.stated && Math.abs(r.o.stated - r.t) >= 1){
      const diff = r.o.stated - r.t;
      alert = `<div class="alert">Kuyumcu toplamı ${tl0(r.o.stated)} dedi ama fiyatları toplayınca ${tl0(r.t)} çıkıyor (${fmt(Math.abs(diff), 0)} ₺ ${diff > 0 ? "fazla" : "eksik"} söylemiş). Hangisinin geçerli olduğunu sor.</div>`;
    }
    html += `<li class="rcard ${i === 0 && full.length > 1 ? "top" : ""}">
        <div class="r-head"><span class="r-no">${i + 1}</span><span class="r-name">${nm(r.o)}</span>${i === 0 && full.length > 1 ? `<span class="badge">En yüksek</span>` : ""}</div>
        <div class="r-total">${tl0(r.t)}</div>
        <dl class="facts">${facts}</dl>${alert}
      </li>`;
  });
  partial.forEach(r => {
    html += `<li class="rcard partial">
        <div class="r-head"><span class="r-no">?</span><span class="r-name">${nm(r.o)}</span></div>
        <div class="hint">Şu altınların fiyatı girilmedi: ${r.missing.map(label).join(", ")}. Tamamlanınca sıralamaya girer.</div>
        <button type="button" class="btn" data-edit="${r.o.id}">Fiyatları tamamla</button>
      </li>`;
  });
  html += `</ol>`;

  // Kuyumcular arası farklar
  if (full.length >= 2){
    html += `<h2>Kuyumcular arası fark</h2><div class="box"><ul class="pairs">`;
    for (let i = 0; i < full.length; i++) for (let j = i + 1; j < full.length; j++){
      const a = full[i], b = full[j], d = a.t - b.t;
      html += `<li><span class="who">${nm(a.o)} – ${nm(b.o)}<small>${Math.abs(d) < 0.5 ? "İkisi aynı veriyor" : `${nm(a.o)} daha fazla veriyor`}</small></span><span class="amt">${fmt(Math.abs(d), 0)} ₺</span></li>`;
    }
    html += `</ul></div>`;
  }

  // Tüm fiyatlar tablosu
  const cols = [...full, ...partial];
  const unitView = ui.tview === "unit";
  html += `<div class="sec-head"><h2>Tüm fiyatlar</h2>
      <div class="seg" role="group" aria-label="Tablo görünümü">
        <button type="button" data-tview="unit" aria-pressed="${unitView}">Birim fiyat</button>
        <button type="button" data-tview="total" aria-pressed="${!unitView}">Tutar</button>
      </div></div>
    <p class="hint">${unitView ? "1 adet ya da 1 gram için verilen fiyat." : "Fiyat × elindeki adet/gram."} Küçük yazı Harem'e göre fark. Yeşil, o altında en çok veren.</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>Altın</th><th class="h">Harem</th>${cols.map(r => `<th>${nm(r.o)}</th>`).join("")}</tr></thead><tbody>`;
  for (const c of own){
    const q = qty(c), hu = hUnit(c);
    const mult = unitView ? 1 : q;
    const vals = cols.map(r => oUnit(r.o, c));
    const present = vals.filter(x => x != null);
    const max = present.length ? Math.max(...present) : null;
    html += `<tr><th scope="row">${label(c)}<small>${fmt(q)} ${unitW(c)}</small></th>
      <td class="h">${hu == null ? "—" : tl0(hu * mult)}</td>
      ${vals.map(u => {
        if (u == null) return `<td class="muted">—</td>`;
        const d = hu == null ? NaN : (u - hu) * mult;
        const isBest = cols.length > 1 && present.length > 1 && Math.abs(u - max) < 0.005;
        return `<td class="${isBest ? "best" : ""}">${tl0(u * mult)}<small class="${d < 0 ? "neg" : "pos"}">${isFinite(d) ? signed(d) : ""}</small></td>`;
      }).join("")}</tr>`;
  }
  html += `</tbody><tfoot>
      <tr><th>Toplam</th><td class="h">${h.missing ? "—" : tl0(h.t)}</td>${cols.map(r => r.missing.length ? `<td class="muted">eksik</td>` : `<td class="${best && r === best && full.length > 1 ? "best" : ""}">${tl0(r.t)}</td>`).join("")}</tr>
      <tr><th>Harem'e göre</th><td class="h">—</td>${cols.map(r => r.missing.length || h.missing ? `<td class="muted">—</td>` : `<td class="${r.t - h.t < 0 ? "neg" : "pos"}">${signed(r.t - h.t)}</td>`).join("")}</tr>
    </tfoot></table></div>`;

  // Her altını en çok verene ayrı ayrı
  if (full.length >= 2){
    let mix = 0, ok = true;
    for (const c of own){
      const us = full.map(r => oUnit(r.o, c)).filter(x => x != null);
      if (!us.length){ ok = false; break; }
      mix += Math.max(...us) * qty(c);
    }
    if (ok && mix - best.t >= 1){
      html += `<p class="hint">İpucu: Her altını en çok veren kuyumcuya ayrı ayrı bozdursan toplam <b class="num">${tl0(mix)}</b> eder, en yüksek tekliften <b class="num">${fmt(mix - best.t, 0)} ₺</b> fazla. Pazarlıkta bunu söyleyebilirsin.</p>`;
    }
  }
  v.innerHTML = html;
}
$("v-sonuc").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.tview){ ui.tview = t.dataset.tview; saveUi(); renderSonuc(); }
  else if (t.dataset.go === "altin") setTab("altin");
  else if (t.dataset.go === "new"){ editing = "new"; setTab("kuyumcu"); }
  else if (t.dataset.edit){ editing = t.dataset.edit; setTab("kuyumcu"); }
});

/* ================= ALTINLARIM ================= */
function renderAltin(){
  const v = $("v-altin");
  v.innerHTML = `<p class="hint">Bozduracağın altınların adedini yaz. Düğünde takılmış ya da eski tarihli olanlar <b>eski</b>, son bir iki yılın basımı ve hiç kullanılmamış olanlar <b>yeni</b> sayılır.</p>
    <div class="box"><div class="alist">${ROWS.map(r => `
      <div class="arow">
        <div class="a-name">${r.name}<small>${r.coin ? "adet" : "gram"}</small></div>
        <div class="a-val" id="av_${r.key}"></div>
        <div class="a-in">${codesOf(r).map(c => `
          <label class="fld">${r.coin ? `<span class="${c.endsWith("_ESKI") ? "e" : ""}">${tagOf(c)}</span>` : ""}
            <input class="in" type="text" inputmode="${isGram(c) ? "decimal" : "numeric"}" id="q_${c}" data-code="${c}" value="${qty(c) ? fmt(qty(c)) : ""}" placeholder="0" aria-label="${label(c)} ${isGram(c) ? "gram" : "adet"}">
          </label>`).join("")}</div>
      </div>`).join("")}</div></div>
    <div class="box a-total"><span>Harem'e göre toplam değer</span><b id="atot"></b></div>
    <button type="button" class="btn primary wide" data-go="sonuc">Sonuca bak</button>`;
  updateAltin();
}
function updateAltin(){
  if ($("v-altin").hidden || !$("atot")) return;
  for (const r of ROWS){
    let t = 0, any = false, miss = false;
    for (const c of codesOf(r)){
      const inp = $("q_" + c); if (inp) inp.classList.toggle("has", qty(c) > 0);
      if (!qty(c)) continue; any = true;
      const u = hUnit(c); if (u == null){ miss = true; continue; }
      t += u * qty(c);
    }
    const el = $("av_" + r.key);
    if (el) el.innerHTML = any ? (miss ? "—" : `<b>${tl0(t)}</b>`) : `<span>${codesOf(r).map(c => tl(hUnit(c))).join(" / ")}</span>`;
  }
  const h = haremTotal();
  $("atot").textContent = owned().length ? (h.missing ? "—" : tl0(h.t)) : "—";
}
$("v-altin").addEventListener("input", e => {
  const t = e.target; if (!t.id || !t.id.startsWith("q_")) return;
  const c = t.dataset.code, n = parseNum(t.value);
  if (isFinite(n) && n > 0) state.holdings[c] = isGram(c) ? n : Math.round(n); else delete state.holdings[c];
  persist(); updateAltin();
});
$("v-altin").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) setTab(b.dataset.go); });

/* ================= KUYUMCULAR ================= */
let editing = null;        // null = liste, "new" = yeni, id = düzenleme
let confirmDel = false;
let draft = null;

function renderKuyumcu(){
  const v = $("v-kuyumcu");
  const own = owned();
  if (!own.length){
    v.innerHTML = `<div class="box empty"><p>Önce bozduracağın altınları gir, sonra kuyumcu fiyatlarını eklersin.</p><button type="button" class="btn primary" data-go="altin">Altınlarımı gir</button></div>`;
    return;
  }
  if (editing){ renderForm(); return; }
  const h = haremTotal();
  v.innerHTML = `<button type="button" class="btn primary wide" data-act="new">+ Yeni kuyumcu fiyatı ekle</button>
    ${state.offers.length ? `<div class="box"><ul class="olist">${state.offers.map(o => {
      const t = offerTotal(o);
      return `<li><div><div class="o-n">${nm(o)}</div>${t.missing.length
        ? `<small class="neg">${t.missing.length} altının fiyatı eksik</small>`
        : `<small>${tl0(t.t)} · Harem'e göre ${h.missing ? "—" : signed(t.t - h.t)}</small>`}</div>
        <button type="button" class="btn" data-act="edit" data-id="${o.id}">Düzenle</button></li>`;
    }).join("")}</ul></div>` : `<p class="hint">Henüz kuyumcu yok. Kuyumcudan fiyat aldıkça buraya ekle.</p>`}`;
}
function renderForm(){
  const v = $("v-kuyumcu");
  const own = owned();
  const isNew = editing === "new";
  const o = isNew ? null : state.offers.find(x => x.id === editing);
  if (!isNew && !o){ editing = null; renderKuyumcu(); return; }
  if (!draft) draft = { name: o ? o.name : "", stated: o && o.stated ? fmt(o.stated) : "", units: Object.fromEntries(own.map(c => [c, o && oUnit(o, c) != null ? fmt(o.units[c]) : ""])) };
  v.innerHTML = `<form class="of" id="oform" novalidate>
      <h2>${isNew ? "Yeni kuyumcu" : "Kuyumcuyu düzenle"}</h2>
      <label class="flabel">Kuyumcu adı
        <input class="in" type="text" id="f_name" autocomplete="off" placeholder="Örn. Damla Kuyum" value="${esc(draft.name)}">
      </label>
      <div class="box">
        <p class="hint">Kuyumcunun söylediği <b>birim fiyatı</b> yaz (1 adet ya da 1 gram için). Kutudaki gri rakam Harem fiyatı.</p>
        ${own.map(c => `<div class="frow">
            <label for="f_${c}">${label(c)}<small>${fmt(qty(c))} ${unitW(c)}</small></label>
            <input class="in" type="text" inputmode="decimal" id="f_${c}" data-code="${c}" placeholder="${hUnit(c) != null ? fmt(hUnit(c)) : ""}" value="${esc(draft.units[c] || "")}">
            <div class="fcalc" id="fc_${c}"></div>
          </div>`).join("")}
      </div>
      <div class="fsum"><span class="hint">Bu kuyumcunun toplamı</span><b id="f_total">—</b><span id="f_diff" class="hint"></span></div>
      <label class="flabel">Kuyumcunun söylediği genel toplam <span class="hint" style="font-weight:400">İsteğe bağlı. Yazarsan hesabı tutuyor mu diye kontrol ederim.</span>
        <input class="in" type="text" inputmode="decimal" id="f_stated" placeholder="örn. 1.236.050" value="${esc(draft.stated)}">
      </label>
      <div class="ferr" id="f_err" hidden></div>
      <div class="actions">
        <button type="submit" class="btn primary">Kaydet</button>
        <button type="button" class="btn" data-act="cancel">Vazgeç</button>
      </div>
      ${isNew ? "" : (confirmDel
        ? `<div class="confirm">Bu kuyumcu silinsin mi? <button type="button" class="btn danger" data-act="del-yes">Evet, sil</button><button type="button" class="btn" data-act="del-no">Hayır</button></div>`
        : `<button type="button" class="btn danger" data-act="del">Bu kuyumcuyu sil</button>`)}
    </form>`;
  updateForm();
}
function readDraftUnits(){
  const out = {};
  for (const c of owned()){ const v = parseNum(draft.units[c]); if (isFinite(v) && v > 0) out[c] = v; }
  return out;
}
function updateForm(){
  if (!draft || !$("f_total")) return;
  const units = readDraftUnits();
  let t = 0, miss = 0;
  for (const c of owned()){
    const el = $("fc_" + c), inp = $("f_" + c);
    if (inp){ inp.classList.toggle("has", units[c] != null); if (hUnit(c) != null) inp.placeholder = fmt(hUnit(c)); }
    if (units[c] == null){ miss++; if (el) el.textContent = ""; continue; }
    const line = units[c] * qty(c); t += line;
    const hu = hUnit(c);
    if (el) el.innerHTML = `= ${tl0(line)}` + (hu != null ? ` · Harem'e göre <span class="${units[c] - hu < 0 ? "neg" : "pos"}">${signed((units[c] - hu) * qty(c))}</span>` : "");
  }
  const h = haremTotal();
  if (miss){ $("f_total").textContent = Object.keys(units).length ? tl0(t) + " (eksik)" : "—"; $("f_diff").textContent = `${miss} altının fiyatı girilmedi`; }
  else { $("f_total").textContent = tl0(t); $("f_diff").innerHTML = h.missing ? "" : "Harem'e göre " + vsHarem(t - h.t, h.t); }
}
$("v-kuyumcu").addEventListener("input", e => {
  const t = e.target; if (!draft) return;
  if (t.id === "f_name") draft.name = t.value;
  else if (t.id === "f_stated") draft.stated = t.value;
  else if (t.id && t.id.startsWith("f_")) { draft.units[t.dataset.code] = t.value; }
  updateForm();
});
$("v-kuyumcu").addEventListener("submit", e => {
  e.preventDefault();
  const err = $("f_err");
  const name = (draft.name || "").trim();
  const units = readDraftUnits();
  if (!name){ err.textContent = "Kuyumcunun adını yaz."; err.hidden = false; $("f_name").focus(); return; }
  if (!Object.keys(units).length){ err.textContent = "En az bir altının fiyatını yaz."; err.hidden = false; return; }
  const st = parseNum(draft.stated);
  if (editing === "new"){
    state.offers.push({ id: "o" + Date.now(), name, stated: isFinite(st) && st > 0 ? st : null, units });
  } else {
    const o = state.offers.find(x => x.id === editing);
    if (o){
      const keep = Object.fromEntries(Object.entries(o.units).filter(([c]) => !owned().includes(c)));
      o.name = name; o.units = Object.assign(keep, units); o.stated = isFinite(st) && st > 0 ? st : null;
    }
  }
  persist(); editing = null; draft = null; confirmDel = false; updateCount();
  setTab("sonuc");
});
$("v-kuyumcu").addEventListener("click", e => {
  const b = e.target.closest("button[data-act], button[data-go]"); if (!b) return;
  if (b.dataset.go){ setTab(b.dataset.go); return; }
  const a = b.dataset.act;
  if (a === "new"){ editing = "new"; draft = null; confirmDel = false; renderKuyumcu(); $("f_name") && $("f_name").focus(); window.scrollTo(0, 0); }
  else if (a === "edit"){ editing = b.dataset.id; draft = null; confirmDel = false; renderKuyumcu(); window.scrollTo(0, 0); }
  else if (a === "cancel"){ editing = null; draft = null; confirmDel = false; renderKuyumcu(); }
  else if (a === "del"){ confirmDel = true; renderForm(); }
  else if (a === "del-no"){ confirmDel = false; renderForm(); }
  else if (a === "del-yes"){
    state.offers = state.offers.filter(x => x.id !== editing);
    persist(); editing = null; draft = null; confirmDel = false; updateCount(); renderKuyumcu();
  }
});

/* ================= CANLI FİYAT (Harem) ================= */
let lastCheck = null, curStatus = "wait", sock = null;
function priceDate(){
  const m = /^(\d{2})-(\d{2})-(\d{4}) (\d{2}):(\d{2}):(\d{2})$/.exec(priceTime || "");
  return m ? new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5], +m[6]) : null;
}
function setStatus(s){
  curStatus = s;
  $("live").dataset.s = s;
  const t = priceTime ? priceTime.replace(/-/g, ".") : "";
  const hm = t.slice(11, 16);
  $("liveText").innerHTML =
    s === "live" ? `<b>Canlı</b> · Harem fiyatı ${hm}` :
    s === "wait" ? `Harem'e bağlanıyor…` :
    `<b>Bağlantı yok</b> · son fiyat ${t.slice(0, 16)}`;
  updateNote();
}
function updateNote(){
  const n = $("liveNote");
  n.className = "note";
  if (curStatus === "off"){ n.className = "note warn"; n.textContent = "Canlı fiyat alınamadı, son bilinen fiyatlar gösteriliyor. İnternetini kontrol edip Yenile'ye bas."; return; }
  const pd = priceDate();
  if (pd && curStatus === "live"){
    const mins = Math.floor((Date.now() - pd.getTime()) / 60000);
    if (mins >= 60){
      const age = mins >= 120 ? Math.floor(mins / 60) + " saattir" : mins + " dakikadır";
      n.textContent = `Fiyat ${age} değişmedi, piyasa kapalı olabilir (hafta sonu fiyat sabit kalır).`;
      return;
    }
  }
  n.textContent = curStatus === "live" ? "Fiyat değiştikçe hesaplar kendiliğinden güncellenir." : "";
}
setInterval(updateNote, 30000);

let rt = null;
function onPrices(){
  if (rt) return;
  rt = setTimeout(() => {
    rt = null;
    if (ui.tab === "sonuc") renderSonuc();
    else if (ui.tab === "altin") updateAltin();
    else if (ui.tab === "kuyumcu"){ if (editing) updateForm(); else renderKuyumcu(); }
  }, 700);
}
function connect(){
  if (typeof io !== "function"){ setStatus("off"); return; }
  setStatus("wait");
  try { sock = io("wss://hrmsocketonly.haremaltin.com:443", { transports: ["websocket"] }); }
  catch(e){ setStatus("off"); return; }
  sock.on("connect", () => setStatus("live"));
  sock.on("disconnect", () => setStatus("wait"));
  sock.on("connect_error", () => setStatus("off"));
  sock.on("price_changed", msg => {
    if (!msg || !msg.data) return;
    lastCheck = new Date();
    let changed = false;
    for (const k in msg.data){ if (ALL_CODES.includes(k) || k === "ALTIN"){ prices[k] = msg.data[k]; changed = true; } }
    const ref = msg.data.ALTIN || msg.data.TEK_ESKI;
    if (ref && ref.tarih) priceTime = ref.tarih;
    if (changed) save(LS_PRICES, { prices, time: priceTime });
    setStatus("live");
    if (changed) onPrices();
  });
  setTimeout(() => { if (curStatus === "wait" && !lastCheck) setStatus("off"); }, 12000);
}
function refresh(){
  if (!sock){ connect(); return; }
  setStatus("wait"); sock.disconnect(); sock.connect();
}
$("refreshBtn").addEventListener("click", refresh);
setInterval(() => { if (sock && (!lastCheck || Date.now() - lastCheck.getTime() > 120000)) refresh(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && sock && (!lastCheck || Date.now() - lastCheck.getTime() > 30000)) refresh(); });

updateCount();
setTab(["sonuc", "altin", "kuyumcu"].includes(ui.tab) ? ui.tab : "sonuc");
connect();
})();
</script>
