<style>
/* Düzen: telefon önce, tek sütun. Üstte canlı fiyat, 3 sekme. Büyük yazı, az ayrıntı, her bölüm ayrı kutuda. */
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --sunk:#E6E8E2; --fg:#151A17; --muted:#4F5752; --line:#D3D7CF;
  --gold:#7E5910; --gold-bg:#F4EAD0; --good:#17633F; --good-bg:#DCEFE3; --bad:#A12E2E; --bad-bg:#F7E0DD;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1211; --surface:#1A1F1C; --sunk:#252B27; --fg:#F1F3EF; --muted:#B4BCB6; --line:#323934;
    --gold:#E2BF6A; --gold-bg:#3A311E; --good:#78D6A0; --good-bg:#1D3729; --bad:#F59B92; --bad-bg:#3E2422;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1211; --surface:#1A1F1C; --sunk:#252B27; --fg:#F1F3EF; --muted:#B4BCB6; --line:#323934;
  --gold:#E2BF6A; --gold-bg:#3A311E; --good:#78D6A0; --good-bg:#1D3729; --bad:#F59B92; --bad-bg:#3E2422;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:17px/1.45 var(--body);font-variant-numeric:tabular-nums;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 70px;
  -webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.app{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;font-weight:700;margin:0}
h2{font-size:20px;font-weight:700;margin:8px 0 0}
p{margin:0}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
button{font:inherit;cursor:pointer;color:var(--fg)}
input,select{font:inherit;color:var(--fg)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Üst */
.top{display:flex;flex-direction:column;gap:4px}
.live{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:16px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--gold);flex:none}
.live[data-s="live"] .dot{background:var(--good);box-shadow:0 0 0 4px var(--good-bg)}
.live[data-s="off"] .dot{background:var(--bad)}
.linkbtn{border:0;background:none;padding:4px 6px;color:var(--gold);font-weight:600;text-decoration:underline}
.note{font-size:15px;color:var(--muted)}
.note.warn{color:var(--bad)}

/* Sekmeler */
.tabs{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:6px}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:11px 2px;font-size:16px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.25)}

.view{display:flex;flex-direction:column;gap:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-weight:700;font-size:17px}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--bg)}
.btn.wide{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.small{padding:8px 12px;font-size:15px}
.link{border:0;background:none;padding:6px 0;color:var(--gold);font-weight:600;font-size:16px;text-decoration:underline;align-self:flex-start}
.empty{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:24px 16px}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);vertical-align:2px;margin-left:6px}
.pill.e{background:var(--gold-bg);color:var(--gold)}

/* Harem kutusu */
.harem{background:var(--gold-bg);border-color:transparent;display:flex;flex-direction:column;gap:2px}
.harem .lbl{font-size:15px;font-weight:700;color:var(--gold)}
.harem .val{font-size:34px;font-weight:700;line-height:1.15}
.harem .sub{font-size:15px;color:var(--muted)}

/* Sıralama kartları */
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.rcard.top{border:2px solid var(--good)}
.r-head{display:flex;align-items:center;gap:10px}
.r-no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--sunk);flex:none}
.rcard.top .r-no{background:var(--good);color:var(--bg)}
.r-name{font-weight:700;font-size:20px;flex:1;min-width:0;overflow-wrap:anywhere}
.badge{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--good-bg);color:var(--good);flex:none}
.r-total{font-size:32px;font-weight:700;line-height:1.15}
.rcard.top .r-total{color:var(--good)}
.r-lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:17px}
.r-lines li{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px}
.r-lines b{white-space:nowrap}
.alert{font-size:16px;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px}
.rcard.partial .r-no{background:var(--bad-bg);color:var(--bad)}

/* Altın altın karşılaştırma */
.cmp{display:flex;flex-direction:column}
.c-head{font-size:18px;font-weight:700;margin-bottom:8px}
.c-head .q{font-weight:500;color:var(--muted);font-size:16px;margin-left:6px}
.c-cols,.c-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:baseline}
.c-cols{font-size:14px;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
.c-cols span:nth-child(n+2),.c-row span:nth-child(n+2){text-align:right}
.c-row{padding:10px 0;border-bottom:1px solid var(--line)}
.c-row:last-child{border-bottom:0}
.c-row .n{font-weight:600;overflow-wrap:anywhere}
.c-row.h .n{color:var(--gold)}
.c-row.best{background:var(--good-bg);margin-inline:-10px;padding-inline:10px;border-radius:10px;border-bottom-color:transparent}
.c-row.best .n::after{content:" ✓";color:var(--good)}
.c-row .t{font-weight:700}
.c-row .t small{display:block;font-weight:600;font-size:14px}

/* Farklar listesi */
.pairs{list-style:none;margin:0;padding:0}
.pairs li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.pairs li:last-child{border-bottom:0}
.pairs .who{min-width:0;overflow-wrap:anywhere}
.pairs .who small{display:block;color:var(--muted);font-size:15px}
.pairs .amt{font-weight:700;font-size:19px;white-space:nowrap}

/* Altınlarım */
.items{display:flex;flex-direction:column;gap:12px}
.item{display:flex;flex-direction:column;gap:10px}
.i-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.i-name{font-size:19px;font-weight:700}
.ctrl{display:flex;align-items:center;gap:10px}
.step{width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:24px;font-weight:600;flex:none;line-height:1}
.in{width:100%;min-width:0;font-size:20px;font-weight:600;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px;height:52px;text-align:center}
.in:focus{border-color:var(--gold)}
.in.left{text-align:left;font-weight:500}
.ctrl .unit{font-size:17px;color:var(--muted);width:44px;flex:none}
.i-sub{font-size:16px;color:var(--muted)}
.i-sub b{color:var(--fg)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-weight:600}
.sum b{font-size:22px;color:var(--gold)}
.addlist{display:flex;flex-wrap:wrap;gap:8px}
.addlist button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;font-weight:600}

/* Kuyumcu listesi ve formu */
.olist{list-style:none;margin:0;padding:0}
.olist li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.olist li:last-child{border-bottom:0}
.olist .o-n{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.olist small{display:block;color:var(--muted);font-size:16px}
form.of{display:flex;flex-direction:column;gap:14px}
.flabel{display:flex;flex-direction:column;gap:8px;font-weight:700}
.flabel small{font-weight:400;color:var(--muted);font-size:15px}
.sec{display:flex;flex-direction:column;gap:8px}
.s-head{font-size:19px;font-weight:700}
.s-head .q{font-weight:500;color:var(--muted);font-size:17px;margin-left:6px}
.s-lbl{font-size:16px;color:var(--muted)}
.pair-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair-in label{display:flex;flex-direction:column;gap:6px;font-weight:600;color:var(--fg);min-width:0}
.pair-in .sm{font-weight:400;color:var(--muted);font-size:14px;margin-top:-6px}
.pair-in .in{font-size:19px;padding:10px 8px}
.s-calc{font-size:16px;min-height:22px}
.s-calc b{font-weight:700}
.fsum{display:flex;flex-direction:column;gap:2px;background:var(--sunk);border-radius:14px;padding:14px 16px}
.fsum b{font-size:28px}
#f_diff b{font-size:inherit}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ferr{color:var(--bad);font-weight:600}
.ver{text-align:center;font-size:13px;color:var(--muted);margin-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <h1>Altın Bozdurma</h1>
    <div class="live" id="live" data-s="wait"><span class="dot"></span><span id="liveText">Harem'e bağlanıyor…</span><button type="button" class="linkbtn" id="refreshBtn">Yenile</button></div>
    <div class="note" id="liveNote"></div>
  </header>

  <nav class="tabs" aria-label="Bölümler">
    <div class="tabs-in" role="tablist">
      <button type="button" role="tab" id="tab-sonuc" data-tab="sonuc" aria-selected="true">Sonuç</button>
      <button type="button" role="tab" id="tab-altin" data-tab="altin" aria-selected="false">Altınlarım</button>
      <button type="button" role="tab" id="tab-kuyumcu" data-tab="kuyumcu" aria-selected="false">Kuyumcular</button>
    </div>
  </nav>

  <main>
    <section class="view" id="v-sonuc" role="tabpanel"></section>
    <section class="view" id="v-altin" role="tabpanel" hidden></section>
    <section class="view" id="v-kuyumcu" role="tabpanel" hidden></section>
  </main>
  <p class="ver">Sürüm 4 · Fiyatlar Harem Altın alış fiyatıdır, bilgi amaçlıdır.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.4.0/socket.io.min.js"></script>
<script>
(function(){
"use strict";
const LS_STATE = "altin-bozdurma-v2";
const LS_PRICES = "altin-bozdurma-fiyat-v1";
const LS_UI = "altin-bozdurma-ui-v1";

const ROWS = [
  {key:"TEK", name:"Tam Altın", coin:true},
  {key:"YARIM", name:"Yarım Altın", coin:true},
  {key:"CEYREK", name:"Çeyrek Altın", coin:true},
  {key:"ATA", name:"Ata Altın", coin:true},
  {key:"ATA5", name:"Ata 5'li", coin:true},
  {key:"GREMESE", name:"Gremse", coin:true},
  {key:"AYAR22", name:"22 Ayar Bilezik", coin:false},
  {key:"AYAR14", name:"14 Ayar Altın", coin:false},
  {key:"KULCEALTIN", name:"Gram Altın (24 ayar)", coin:false}
];
const codesOf = r => r.coin ? [r.key+"_ESKI", r.key+"_YENI"] : [r.key];
const ALL_CODES = ROWS.flatMap(codesOf);
const rowOf = c => ROWS.find(r => codesOf(r).includes(c));
const isGram = c => !(c.endsWith("_YENI") || c.endsWith("_ESKI"));
const tagOf = c => c.endsWith("_YENI") ? "Yeni" : c.endsWith("_ESKI") ? "Eski" : "";
const unitW = c => isGram(c) ? "gram" : "adet";
const nameHtml = c => `${rowOf(c).name}${tagOf(c) ? `<span class="pill ${c.endsWith("_ESKI") ? "e" : ""}">${tagOf(c)}</span>` : ""}`;
const nameTxt = c => rowOf(c).name + (tagOf(c) ? " (" + tagOf(c) + ")" : "");

const DEFAULT_STATE = {
  holdings: { TEK_ESKI: 9, ATA_ESKI: 2, YARIM_ESKI: 3, AYAR22: 129 },
  offers: [
    { id:"o1", name:"1. Kuyumcu", stated:1236050,
      units:{ TEK_ESKI:359250/9, ATA_ESKI:82300/2, YARIM_ESKI:60000/3, AYAR22:734500/129 } },
    { id:"o2", name:"Damla Kuyum", stated:1238875,
      units:{ TEK_ESKI:39950, ATA_ESKI:41200, YARIM_ESKI:19950, AYAR22:5675 } }
  ]
};
const FALLBACK_TIME = "31-10-2026 18:06:07";
const FALLBACK_ALIS = { CEYREK_YENI:10147, CEYREK_ESKI:9973, YARIM_YENI:20320, YARIM_ESKI:19946, TEK_YENI:40515, TEK_ESKI:39954,
  ATA_YENI:41605, ATA_ESKI:41182, ATA5_YENI:207560, ATA5_ESKI:205690, GREMESE_YENI:100539, GREMESE_ESKI:99417,
  AYAR22:5670.06, AYAR14:3400.50, KULCEALTIN:6201.86, ALTIN:6233.03 };

function load(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

let state = load(LS_STATE) || JSON.parse(JSON.stringify(DEFAULT_STATE));
state.holdings = state.holdings || {};
state.offers = (state.offers || []).map(o => ({ id:o.id, name:o.name || "", stated:o.stated || null, units:o.units || {} }));
const persist = () => save(LS_STATE, state);

const cached = load(LS_PRICES);
let prices = cached && cached.prices ? cached.prices
  : Object.fromEntries(Object.entries(FALLBACK_ALIS).map(([k, v]) => [k, { alis: v }]));
let priceTime = cached && cached.time ? cached.time : FALLBACK_TIME;

const ui = Object.assign({ tab:"sonuc" }, load(LS_UI) || {});
const saveUi = () => save(LS_UI, { tab: ui.tab });

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function fmt(n, dec){
  if (n == null || !isFinite(n)) return "—";
  const d = dec != null ? dec : (Math.abs(n - Math.round(n)) < 0.005 ? 0 : 2);
  return n.toLocaleString("tr-TR", { minimumFractionDigits:d, maximumFractionDigits:d });
}
const tl = n => (n == null || !isFinite(n)) ? "—" : fmt(n) + " ₺";
const tlr = n => (n == null || !isFinite(n)) ? "—" : fmt(Math.round(n), 0) + " ₺";
function parseNum(s){
  if (s == null) return NaN;
  s = String(s).replace(/[\s₺]/g, "").replace(/tl$/i, "");
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if ((s.match(/\./g) || []).length > 1 || /\.\d{3}$/.test(s)) s = s.replace(/\./g, "");
  return parseFloat(s);
}
const nm = o => esc((o.name || "").trim() || "İsimsiz kuyumcu");
/* "1.835 ₺ fazla" / "2.340 ₺ eksik" */
function moreLess(d){
  if (!isFinite(d)) return "—";
  if (Math.abs(d) < 0.5) return `<b>aynı</b>`;
  return `<b class="${d < 0 ? "neg" : "pos"}">${fmt(Math.abs(Math.round(d)), 0)} ₺ ${d < 0 ? "eksik" : "fazla"}</b>`;
}
function smallDiff(d){
  if (!isFinite(d)) return "";
  if (Math.abs(d) < 0.5) return `<small class="muted">Harem ile aynı</small>`;
  return `<small class="${d < 0 ? "neg" : "pos"}">${d < 0 ? "−" : "+"}${fmt(Math.abs(Math.round(d)), 0)} ₺</small>`;
}

const qty = c => state.holdings[c] || 0;
const owned = () => ALL_CODES.filter(c => qty(c) > 0);
function hUnit(c){ const p = prices[c]; if (!p) return null; const v = parseFloat(p.alis); return isFinite(v) ? v : null; }
const oUnit = (o, c) => (o.units[c] != null && isFinite(o.units[c]) && o.units[c] > 0) ? o.units[c] : null;
function haremTotal(){
  let t = 0, missing = false;
  for (const c of owned()){ const u = hUnit(c); if (u == null){ missing = true; continue; } t += u * qty(c); }
  return { t, missing };
}
function offerTotal(o){
  let t = 0; const missing = [];
  for (const c of owned()){ const u = oUnit(o, c); if (u == null){ missing.push(c); continue; } t += u * qty(c); }
  return { t, missing };
}

/* ================= SEKMELER ================= */
function setTab(t){
  ui.tab = t; saveUi();
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", b.dataset.tab === t ? "true" : "false");
  $("v-sonuc").hidden = t !== "sonuc";
  $("v-altin").hidden = t !== "altin";
  $("v-kuyumcu").hidden = t !== "kuyumcu";
  render();
  window.scrollTo(0, 0);
}
function render(){
  if (ui.tab === "sonuc") renderSonuc();
  else if (ui.tab === "altin") renderAltin();
  else renderKuyumcu();
}
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]"); if (b){ if (b.dataset.tab !== "kuyumcu"){ editing = null; draft = null; } setTab(b.dataset.tab); }
});

/* ================= SONUÇ ================= */
function renderSonuc(){
  const v = $("v-sonuc");
  const own = owned();
  if (!own.length){
    v.innerHTML = `<div class="box empty"><p>Önce bozduracağın altınları gir.</p><button type="button" class="btn primary" data-go="altin">Altınlarımı gir</button></div>`;
    return;
  }
  const h = haremTotal();
  const res = state.offers.map(o => ({ o, ...offerTotal(o) }));
  const full = res.filter(r => !r.missing.length).sort((a, b) => b.t - a.t);
  const partial = res.filter(r => r.missing.length);
  const best = full[0];
  const pt = priceTime ? priceTime.slice(0, 16).replace(/-/g, ".") : "";

  let html = `<div class="box harem">
      <span class="lbl">Harem'e göre değeri (anlık)</span>
      <span class="val">${h.missing ? "—" : tlr(h.t)}</span>
      <span class="sub">Fiyat saati ${pt}</span>
    </div>`;

  if (!state.offers.length){
    html += `<div class="box empty"><p>Henüz kuyumcu fiyatı girmedin.</p><button type="button" class="btn primary" data-go="new">+ Kuyumcu fiyatı ekle</button></div>`;
    v.innerHTML = html; return;
  }

  html += `<h2>Kim kaç veriyor?</h2><ol class="rank">`;
  full.forEach((r, i) => {
    const lines = [];
    lines.push(`<li><span>Harem'e göre</span>${h.missing ? "—" : moreLess(r.t - h.t)}</li>`);
    if (i === 0 && full[1]) lines.push(`<li><span>2. sıradakinden</span>${moreLess(r.t - full[1].t)}</li>`);
    if (i > 0) lines.push(`<li><span>1. sıradakinden</span>${moreLess(r.t - best.t)}</li>`);
    let alert = "";
    if (r.o.stated && Math.abs(r.o.stated - r.t) >= 1){
      const diff = r.o.stated - r.t;
      alert = `<div class="alert">Kuyumcu toplam ${tlr(r.o.stated)} dedi, fiyatları toplayınca ${tlr(r.t)} çıkıyor. ${fmt(Math.abs(diff), 0)} ₺ ${diff > 0 ? "fazla" : "eksik"} söylemiş, sor.</div>`;
    }
    html += `<li class="rcard ${i === 0 && full.length > 1 ? "top" : ""}">
        <div class="r-head"><span class="r-no">${i + 1}</span><span class="r-name">${nm(r.o)}</span>${i === 0 && full.length > 1 ? `<span class="badge">En yüksek</span>` : ""}</div>
        <div class="r-total">${tlr(r.t)}</div>
        <ul class="r-lines">${lines.join("")}</ul>${alert}
      </li>`;
  });
  partial.forEach(r => {
    html += `<li class="rcard partial">
        <div class="r-head"><span class="r-no">!</span><span class="r-name">${nm(r.o)}</span></div>
        <p>Fiyatı girilmeyen: <b>${r.missing.map(nameTxt).join(", ")}</b></p>
        <button type="button" class="btn small" data-edit="${r.o.id}">Fiyatları tamamla</button>
      </li>`;
  });
  html += `</ol>`;

  if (full.length >= 2){
    html += `<h2>Kuyumcular arasındaki fark</h2><div class="box"><ul class="pairs">`;
    for (let i = 0; i < full.length; i++) for (let j = i + 1; j < full.length; j++){
      const a = full[i], b = full[j], d = a.t - b.t;
      html += `<li><span class="who">${nm(a.o)} ↔ ${nm(b.o)}<small>${Math.abs(d) < 0.5 ? "İkisi aynı" : `${nm(a.o)} daha çok veriyor`}</small></span><span class="amt">${fmt(Math.abs(Math.round(d)), 0)} ₺</span></li>`;
    }
    html += `</ul></div>`;
  }

  // Altın altın fiyatlar
  const offersAll = [...full, ...partial].map(r => r.o);
  html += `<h2>Altın altın fiyatlar</h2>`;
  for (const c of own){
    const q = qty(c), hu = hUnit(c);
    const rows = offersAll.map(o => ({ o, u: oUnit(o, c) })).filter(x => x.u != null).sort((a, b) => b.u - a.u);
    const max = rows.length ? rows[0].u : null;
    html += `<div class="box cmp">
      <div class="c-head">${nameHtml(c)}<span class="q">${fmt(q)} ${unitW(c)}</span></div>
      <div class="c-cols"><span></span><span>1 ${isGram(c) ? "gram" : "adet"}</span><span>Toplam</span></div>
      <div class="c-row h"><span class="n">Harem</span><span>${tl(hu)}</span><span class="t">${hu == null ? "—" : tlr(hu * q)}</span></div>
      ${rows.map(x => `<div class="c-row ${rows.length > 1 && Math.abs(x.u - max) < 0.005 ? "best" : ""}">
          <span class="n">${nm(x.o)}</span><span>${tl(x.u)}</span>
          <span class="t">${tlr(x.u * q)}${hu == null ? "" : smallDiff((x.u - hu) * q)}</span>
        </div>`).join("")}
      ${rows.length ? "" : `<p class="muted">Bu altın için henüz kuyumcu fiyatı yok.</p>`}
    </div>`;
  }

  if (full.length >= 2){
    let mix = 0, ok = true;
    for (const c of own){
      const us = full.map(r => oUnit(r.o, c)).filter(x => x != null);
      if (!us.length){ ok = false; break; }
      mix += Math.max(...us) * qty(c);
    }
    if (ok && mix - best.t >= 1){
      html += `<div class="box"><b>Pazarlık ipucu:</b> Her altını en çok verene ayrı ayrı bozdursan toplam <b>${tlr(mix)}</b> eder. Bu, en yüksek tekliften <b class="pos">${fmt(Math.round(mix - best.t), 0)} ₺ fazla</b>.</div>`;
    }
  }
  v.innerHTML = html;
}
$("v-sonuc").addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.dataset.go === "altin") setTab("altin");
  else if (t.dataset.go === "new"){ editing = "new"; draft = null; setTab("kuyumcu"); }
  else if (t.dataset.edit){ editing = t.dataset.edit; draft = null; setTab("kuyumcu"); }
});

/* ================= ALTINLARIM ================= */
let shown = null;     // ekranda gösterilen altınlar (0'a inse de satır kalsın diye)
let addOpen = false;
function renderAltin(){
  const v = $("v-altin");
  if (!shown) shown = owned();
  shown = shown.filter(c => ALL_CODES.includes(c));
  const notShown = ALL_CODES.filter(c => !shown.includes(c));
  v.innerHTML = `
    ${shown.length ? `<div class="items">${shown.map(c => `
      <div class="box item">
        <div class="i-top"><span class="i-name">${nameHtml(c)}</span><button type="button" class="link" data-remove="${c}">Kaldır</button></div>
        <div class="ctrl">
          ${isGram(c) ? "" : `<button type="button" class="step" data-step="-1" data-code="${c}" aria-label="Azalt">−</button>`}
          <input class="in" type="text" inputmode="${isGram(c) ? "decimal" : "numeric"}" id="q_${c}" data-code="${c}" value="${qty(c) ? fmt(qty(c)) : ""}" placeholder="0" aria-label="${nameTxt(c)} ${unitW(c)}">
          ${isGram(c) ? "" : `<button type="button" class="step" data-step="1" data-code="${c}" aria-label="Artır">+</button>`}
          <span class="unit">${unitW(c)}</span>
        </div>
        <div class="i-sub" id="is_${c}"></div>
      </div>`).join("")}</div>
      <div class="box sum"><span>Harem'e göre toplam</span><b id="atot"></b></div>`
    : `<div class="box empty"><p>Bozduracağın altını aşağıdan seçerek ekle.</p></div>`}
    ${addOpen || !shown.length
      ? `<div class="box"><p style="margin-bottom:10px;font-weight:700">Hangi altını ekleyeceksin?</p><div class="addlist">${notShown.map(c => `<button type="button" data-add="${c}">${nameTxt(c)}</button>`).join("")}</div></div>`
      : `<button type="button" class="btn wide" data-act="open-add">+ Başka altın ekle</button>`}
    ${shown.length ? `<button type="button" class="btn primary wide" data-go="sonuc">Sonuca bak</button>` : ""}`;
  updateAltin();
}
function updateAltin(){
  if ($("v-altin").hidden) return;
  for (const c of shown || []){
    const el = $("is_" + c); if (!el) continue;
    const u = hUnit(c), q = qty(c);
    el.innerHTML = u == null ? "Harem fiyatı yok" : (q ? `Harem: ${tl(u)} × ${fmt(q)} = <b>${tlr(u * q)}</b>` : `Harem: ${tl(u)} / ${isGram(c) ? "gram" : "adet"}`);
  }
  const at = $("atot");
  if (at){ const h = haremTotal(); at.textContent = owned().length ? (h.missing ? "—" : tlr(h.t)) : "—"; }
}
function setQty(c, n){
  if (isFinite(n) && n > 0) state.holdings[c] = isGram(c) ? n : Math.round(n); else delete state.holdings[c];
  persist();
}
$("v-altin").addEventListener("input", e => {
  const t = e.target; if (!t.id || !t.id.startsWith("q_")) return;
  setQty(t.dataset.code, parseNum(t.value)); updateAltin();
});
$("v-altin").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.step){
    const c = b.dataset.code; const n = Math.max(0, qty(c) + Number(b.dataset.step));
    setQty(c, n); const inp = $("q_" + c); if (inp) inp.value = n ? fmt(n) : ""; updateAltin();
  } else if (b.dataset.remove){
    const c = b.dataset.remove; delete state.holdings[c]; persist();
    shown = shown.filter(x => x !== c); renderAltin();
  } else if (b.dataset.add){
    const c = b.dataset.add; shown.push(c); addOpen = false;
    if (!isGram(c) && !qty(c)) setQty(c, 1);
    renderAltin(); const inp = $("q_" + c); if (inp){ inp.focus(); inp.select && inp.select(); }
  } else if (b.dataset.act === "open-add"){ addOpen = true; renderAltin(); }
  else if (b.dataset.go){ shown = null; setTab(b.dataset.go); }
});

/* ================= KUYUMCULAR ================= */
let editing = null;      // null liste, "new" yeni, id düzenleme
let confirmDel = false;
let draft = null;

function renderKuyumcu(){
  const v = $("v-kuyumcu");
  if (!owned().length){
    v.innerHTML = `<div class="box empty"><p>Önce bozduracağın altınları gir.</p><button type="button" class="btn primary" data-go="altin">Altınlarımı gir</button></div>`;
    return;
  }
  if (editing){ renderForm(); return; }
  const h = haremTotal();
  v.innerHTML = `<button type="button" class="btn primary wide" data-act="new">+ Yeni kuyumcu fiyatı ekle</button>
    ${state.offers.length ? `<div class="box"><ul class="olist">${state.offers.map(o => {
      const t = offerTotal(o);
      return `<li><div><div class="o-n">${nm(o)}</div>${t.missing.length
        ? `<small class="neg">${t.missing.length} altının fiyatı eksik</small>`
        : `<small>${tlr(t.t)} · Harem'e göre ${h.missing ? "—" : moreLess(t.t - h.t)}</small>`}</div>
        <button type="button" class="btn small" data-act="edit" data-id="${o.id}">Düzenle</button></li>`;
    }).join("")}</ul></div>` : `<p class="muted">Henüz kuyumcu yok. Kuyumcudan fiyat aldıkça buradan ekle.</p>`}`;
}
function renderForm(){
  const v = $("v-kuyumcu");
  const own = owned();
  const isNew = editing === "new";
  const o = isNew ? null : state.offers.find(x => x.id === editing);
  if (!isNew && !o){ editing = null; renderKuyumcu(); return; }
  if (!draft) draft = { name: o ? o.name : "", stated: o && o.stated ? fmt(o.stated) : "",
    u: Object.fromEntries(own.map(c => [c, o ? oUnit(o, c) : null])) };
  v.innerHTML = `<form class="of" id="oform" novalidate>
      <h2 style="margin:0">${isNew ? "Yeni kuyumcu" : "Kuyumcuyu düzenle"}</h2>
      <div class="box">
        <label class="flabel">Kuyumcunun adı
          <input class="in left" type="text" id="f_name" autocomplete="off" placeholder="Örn. Damla Kuyum" value="${esc(draft.name)}">
        </label>
      </div>
      ${own.map((c, i) => `<div class="box sec">
          <div class="s-head">${nameHtml(c)}<span class="q">${fmt(qty(c))} ${unitW(c)}</span></div>
          <div class="pair-in">
            <label class="s-lbl" for="f_${c}">Birim fiyat<span class="sm">1 ${isGram(c) ? "gram" : "adet"}</span>
              <input class="in" type="text" inputmode="decimal" id="f_${c}" data-code="${c}" data-kind="unit" placeholder="${hUnit(c) != null ? fmt(hUnit(c)) : ""}" value="${draft.u[c] != null ? fmt(draft.u[c]) : ""}">
            </label>
            <label class="s-lbl" for="ft_${c}">Toplam tutar<span class="sm">${fmt(qty(c))} ${unitW(c)}</span>
              <input class="in" type="text" inputmode="decimal" id="ft_${c}" data-code="${c}" data-kind="total" placeholder="${hUnit(c) != null ? fmt(Math.round(hUnit(c) * qty(c)), 0) : ""}" value="${draft.u[c] != null ? fmt(Math.round(draft.u[c] * qty(c) * 100) / 100) : ""}">
            </label>
          </div>
          <div class="s-calc" id="fc_${c}"></div>
        </div>`).join("")}
      <div class="fsum"><span class="muted">Bu kuyumcunun toplamı</span><b id="f_total">—</b><span id="f_diff"></span></div>
      <div class="box">
        <label class="flabel">Kuyumcunun söylediği toplam <small>İsteğe bağlı. Yazarsan hesabı tutuyor mu diye kontrol eder.</small>
          <input class="in" type="text" inputmode="decimal" id="f_stated" placeholder="Boş bırakabilirsin" value="${esc(draft.stated)}">
        </label>
      </div>
      <div class="ferr" id="f_err" hidden></div>
      <div class="actions">
        <button type="button" class="btn" data-act="cancel">Vazgeç</button>
        <button type="submit" class="btn primary">Kaydet</button>
      </div>
      ${isNew ? "" : (confirmDel
        ? `<div class="confirm"><span>Bu kuyumcu silinsin mi?</span><button type="button" class="btn danger small" data-act="del-yes">Evet, sil</button><button type="button" class="btn small" data-act="del-no">Hayır</button></div>`
        : `<button type="button" class="btn danger" data-act="del">Bu kuyumcuyu sil</button>`)}
    </form>`;
  updateForm();
}
function draftUnits(){
  const out = {};
  for (const c of owned()){ const v = draft.u[c]; if (v != null && isFinite(v) && v > 0) out[c] = v; }
  return out;
}
function updateForm(){
  if (!draft || !$("f_total")) return;
  const units = draftUnits();
  let t = 0, miss = 0;
  for (const c of owned()){
    const el = $("fc_" + c);
    if (units[c] == null){ miss++; if (el) el.innerHTML = `<span class="muted">Birim fiyatı ya da toplam tutarı yaz, öbürü kendiliğinden dolar.</span>`; continue; }
    const line = units[c] * qty(c); t += line;
    const hu = hUnit(c);
    if (el) el.innerHTML = `Birim: <b>${tl(units[c])}</b> · Toplam: <b>${tl(Math.round(line * 100) / 100)}</b>` + (hu != null ? `<br>Harem'e göre ${moreLess((units[c] - hu) * qty(c))}` : "");
  }
  const h = haremTotal();
  if (miss){
    $("f_total").textContent = Object.keys(units).length ? tlr(t) : "—";
    $("f_diff").innerHTML = `<span class="muted">${miss} altının fiyatı daha girilmedi</span>`;
  } else {
    $("f_total").textContent = tlr(t);
    $("f_diff").innerHTML = h.missing ? "" : `Harem'e göre ${moreLess(t - h.t)}`;
  }
}
$("v-kuyumcu").addEventListener("input", e => {
  const t = e.target; if (!draft) return;
  if (t.id === "f_name") draft.name = t.value;
  else if (t.id === "f_stated") draft.stated = t.value;
  else if (t.dataset && t.dataset.code){
    const c = t.dataset.code, q = qty(c), n = parseNum(t.value);
    const ok = isFinite(n) && n > 0;
    if (t.dataset.kind === "total"){
      draft.u[c] = ok ? n / q : null;
      $("f_" + c).value = ok ? fmt(Math.round(n / q * 100) / 100) : "";
    } else {
      draft.u[c] = ok ? n : null;
      $("ft_" + c).value = ok ? fmt(Math.round(n * q * 100) / 100) : "";
    }
  }
  updateForm();
});
$("v-kuyumcu").addEventListener("submit", e => {
  e.preventDefault();
  const err = $("f_err");
  const name = (draft.name || "").trim();
  const units = draftUnits();
  if (!name){ err.textContent = "Kuyumcunun adını yaz."; err.hidden = false; $("f_name").focus(); return; }
  if (!Object.keys(units).length){ err.textContent = "En az bir altının fiyatını yaz."; err.hidden = false; return; }
  const st = parseNum(draft.stated);
  if (editing === "new"){
    state.offers.push({ id: "o" + Date.now(), name, stated: isFinite(st) && st > 0 ? st : null, units });
  } else {
    const o = state.offers.find(x => x.id === editing);
    if (o){
      const keep = Object.fromEntries(Object.entries(o.units).filter(([c]) => !owned().includes(c)));
      o.name = name; o.units = Object.assign(keep, units); o.stated = isFinite(st) && st > 0 ? st : null;
    }
  }
  persist(); editing = null; draft = null; confirmDel = false;
  setTab("sonuc");
});
$("v-kuyumcu").addEventListener("click", e => {
  const b = e.target.closest("button[data-act], button[data-go]"); if (!b) return;
  if (b.dataset.go){ setTab(b.dataset.go); return; }
  const a = b.dataset.act;
  if (a === "new"){ editing = "new"; draft = null; confirmDel = false; renderKuyumcu(); window.scrollTo(0, 0); }
  else if (a === "edit"){ editing = b.dataset.id; draft = null; confirmDel = false; renderKuyumcu(); window.scrollTo(0, 0); }
  else if (a === "cancel"){ editing = null; draft = null; confirmDel = false; renderKuyumcu(); window.scrollTo(0, 0); }
  else if (a === "del"){ confirmDel = true; renderForm(); }
  else if (a === "del-no"){ confirmDel = false; renderForm(); }
  else if (a === "del-yes"){
    state.offers = state.offers.filter(x => x.id !== editing);
    persist(); editing = null; draft = null; confirmDel = false; renderKuyumcu();
  }
});
// Klavyede "ileri" deyince sonraki fiyat kutusuna geç
$("v-kuyumcu").addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.dataset || !e.target.dataset.code) return;
  const inputs = [...document.querySelectorAll(`#oform input[data-kind="${e.target.dataset.kind}"]`)];
  const i = inputs.indexOf(e.target);
  if (i >= 0 && i < inputs.length - 1){ e.preventDefault(); inputs[i + 1].focus(); }
});

/* ================= CANLI FİYAT (Harem) ================= */
let lastCheck = null, curStatus = "wait", sock = null;
function priceDate(){
  const m = /^(\d{2})-(\d{2})-(\d{4}) (\d{2}):(\d{2}):(\d{2})$/.exec(priceTime || "");
  return m ? new Date(+m[3], +m[2]-1, +m[1], +m[4], +m[5], +m[6]) : null;
}
function setStatus(s){
  curStatus = s;
  $("live").dataset.s = s;
  const t = priceTime ? priceTime.replace(/-/g, ".") : "";
  $("liveText").innerHTML =
    s === "live" ? `<b>Canlı fiyat</b> · ${t.slice(11, 16)}` :
    s === "wait" ? `Harem'e bağlanıyor…` :
    `<b>Bağlantı yok</b> · son fiyat ${t.slice(0, 16)}`;
  updateNote();
}
function updateNote(){
  const n = $("liveNote");
  n.className = "note";
  if (curStatus === "off"){ n.className = "note warn"; n.textContent = "Canlı fiyat alınamadı, son bilinen fiyatlar gösteriliyor. İnternetini kontrol edip Yenile'ye bas."; return; }
  const pd = priceDate();
  if (pd && curStatus === "live" && Date.now() - pd.getTime() >= 3600000){
    n.textContent = "Piyasa şu an kapalı, en son fiyat gösteriliyor.";
    return;
  }
  n.textContent = "";
}
setInterval(updateNote, 30000);

let rt = null;
function onPrices(){
  if (rt) return;
  rt = setTimeout(() => {
    rt = null;
    if (ui.tab === "sonuc") renderSonuc();
    else if (ui.tab === "altin") updateAltin();
    else if (editing) updateForm(); else renderKuyumcu();
  }, 700);
}
function connect(){
  if (typeof io !== "function"){ setStatus("off"); return; }
  setStatus("wait");
  try { sock = io("wss://hrmsocketonly.haremaltin.com:443", { transports: ["websocket"] }); }
  catch(e){ setStatus("off"); return; }
  sock.on("connect", () => setStatus("live"));
  sock.on("disconnect", () => setStatus("wait"));
  sock.on("connect_error", () => setStatus("off"));
  sock.on("price_changed", msg => {
    if (!msg || !msg.data) return;
    lastCheck = new Date();
    let changed = false;
    for (const k in msg.data){ if (ALL_CODES.includes(k) || k === "ALTIN"){ prices[k] = msg.data[k]; changed = true; } }
    const ref = msg.data.ALTIN || msg.data.TEK_ESKI;
    if (ref && ref.tarih) priceTime = ref.tarih;
    if (changed) save(LS_PRICES, { prices, time: priceTime });
    setStatus("live");
    if (changed) onPrices();
  });
  setTimeout(() => { if (curStatus === "wait" && !lastCheck) setStatus("off"); }, 12000);
}
function refresh(){
  if (!sock){ connect(); return; }
  setStatus("wait"); sock.disconnect(); sock.connect();
}
$("refreshBtn").addEventListener("click", refresh);
setInterval(() => { if (sock && (!lastCheck || Date.now() - lastCheck.getTime() > 120000)) refresh(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && sock && (!lastCheck || Date.now() - lastCheck.getTime() > 30000)) refresh(); });

setTab(["sonuc", "altin", "kuyumcu"].includes(ui.tab) ? ui.tab : "sonuc");
connect();
})();
</script>
